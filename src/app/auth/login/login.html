<div class="login-container">
  <div class="login-card">
    <h2>ورود به پنل مدیریت</h2>
    <div class="form-field">
      <mat-form-field appearance="outline">
        <mat-label>ایمیل</mat-label>
        <input matInput [(ngModel)]="email" type="email" required />
      </mat-form-field>
    </div>
    <div class="form-field">
      <mat-form-field appearance="outline">
        <mat-label>رمز عبور</mat-label>
        <input matInput [(ngModel)]="password" type="password" required />
      </mat-form-field>
    </div>
    <button mat-raised-button color="primary" (click)="onSubmit()">ورود</button>
  </div>
</div>
