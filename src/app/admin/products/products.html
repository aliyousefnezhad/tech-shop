<div class="admin-products-container">
  <h2>مدیریت محصولات</h2>

  <!-- فرم افزودن/ویرایش محصول -->
  <div class="product-form-card">
    <h3>{{ editingProduct ? 'ویرایش محصول' : 'افزودن محصول جدید' }}</h3>

    <div class="form-row">
      <mat-form-field appearance="fill">
        <mat-label>نام محصول</mat-label>
        <input matInput [(ngModel)]="newProduct.name" />
      </mat-form-field>
    </div>

    <div class="form-row">
      <mat-form-field appearance="fill">
        <mat-label>برند</mat-label>
        <input matInput [(ngModel)]="newProduct.brand" />
      </mat-form-field>
    </div>

    <div class="form-row">
      <mat-form-field appearance="fill">
        <mat-label>دسته‌بندی</mat-label>
        <mat-select [(ngModel)]="newProduct.category">
          <mat-option value="laptop">لپتاپ</mat-option>
          <mat-option value="phone">گوشی</mat-option>
          <mat-option value="headphone">هدفون</mat-option>
        </mat-select>
      </mat-form-field>
    </div>

    <div class="form-row">
      <mat-form-field appearance="fill">
        <mat-label>قیمت (تومان)</mat-label>
        <input matInput type="number" [(ngModel)]="newProduct.price" />
      </mat-form-field>
    </div>

    <div class="form-row">
      <label>آپلود تصویر محصول</label>
      <input type="file" (change)="onFileSelected($event)" accept="image/*" />
      <div *ngIf="previewImage" class="image-preview">
        <img [src]="previewImage" alt="پیش‌نمایش تصویر" />
      </div>
    </div>

    <div class="form-actions">
      <button mat-raised-button color="primary" (click)="editingProduct ? updateProduct() : addProduct()">
        {{ editingProduct ? 'به‌روزرسانی محصول' : 'افزودن محصول' }}
      </button>
      <button mat-button (click)="resetForm()">لغو</button>
    </div>
  </div>

  <!-- لیست محصولات -->
  <div class="product-list">
    <h3>لیست محصولات</h3>
    <div class="product-item" *ngFor="let product of products">
      <img [src]="product.image" [alt]="product.name" />
      <div class="product-info">
        <h4>{{ product.name }}</h4>
        <p>{{ product.brand }} - {{ product.category }}</p>
        <p class="price">{{ product.price | currency:'IRR':'symbol':'0.0' }}</p>
      </div>
      <div class="product-actions">
        <button mat-icon-button color="accent" (click)="editProduct(product)">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="deleteProduct(product.id)">
          <mat-icon>delete</mat-icon>
        </button>
      </div>
    </div>
  </div>
</div>
