<div class="cart-container">
  <h2>سبد خرید شما</h2>

  @if (cartItems.length === 0) {
    <div class="empty-cart">
      <p>سبد خرید شما خالی است.</p>
      <a routerLink="/shop/products" mat-button color="primary">مشاهده محصولات</a>
    </div>
  } @else {
    <div class="cart-items">
      @for (item of cartItems; track item.id) {
        <div class="cart-item">
          <img [src]="item.image" [alt]="item.name" />
          <div class="item-info">
            <h3>{{ item.name }}</h3>
            <p>{{ item.brand }}</p>
            <div class="price">{{ item.price | currency:'IRR':'symbol':'0.0' }}</div>
          </div>
          <button mat-icon-button color="warn" (click)="removeFromCart(item.id)">
            <mat-icon>delete</mat-icon>
          </button>
        </div>
      }
    </div>

    <div class="cart-summary">
      <div class="total">
        <strong>جمع کل:</strong>
        <span>{{ totalPrice | currency:'IRR':'symbol':'0.0' }}</span>
      </div>
      <div class="actions">
        <button mat-button (click)="clearCart()">پاک کردن سبد</button>
        <button mat-raised-button color="primary">ادامه خرید</button>
      </div>
    </div>
  }
</div>
