<mat-toolbar class="main-toolbar" [class.scrolled]="scrolled">
  <!-- سمت چپ: ورود/خروج و سبد خرید -->
  <div class="left-section">
    @if (!authService.isLoggedIn()) {
      <a routerLink="/login" mat-button class="auth-btn">ورود</a>
    } @else {
      <button mat-button class="auth-btn" (click)="logout()">خروج</button>
    }

    <a routerLink="/shop/cart" mat-icon-button class="cart-btn">
      <mat-icon>shopping_cart</mat-icon>
      @if (cartItemCount > 0) {
        <span class="cart-badge">{{ cartItemCount }}</span>
      }
    </a>
  </div>

  <!-- سمت راست: لوگو -->
  <div class="logo-section">
    <div class="logo-container">
      <a routerLink="/shop/home" class="logo">
        <img src="https://images.unsplash.com/photo-1611162617213-7d7a39e9b1d7?w=200&h=200&fit=crop&crop=faces" alt="TechShop Logo" />
      </a>
    </div>
  </div>

  <!-- منوی اصلی (دسته‌بندی‌ها + پنل مدیریت) -->
  <div class="nav-background full-width-nav">
    <nav class="desktop-nav">
      <a routerLink="/shop/products" mat-button>محصولات</a>
      <a routerLink="/shop/products" [queryParams]="{category: 'laptop'}" mat-button>لپتاپ</a>
      <a routerLink="/shop/products" [queryParams]="{category: 'phone'}" mat-button>گوشی</a>
      <a routerLink="/shop/products" [queryParams]="{category: 'headphone'}" mat-button>هدفون</a>
      <a routerLink="/admin" mat-button>پنل مدیریت</a>
    </nav>
  </div>

  <!-- دکمه همبرگر موبایل -->
  <button mat-icon-button class="mobile-menu-button" (click)="toggleMobileMenu()">
    <mat-icon>menu</mat-icon>
  </button>

  <!-- منوی موبایل -->
  <div class="mobile-nav" [class.open]="isMobileMenuOpen">
    <a routerLink="/shop/products" mat-button (click)="isMobileMenuOpen = false">محصولات</a>
<a routerLink="/shop/products" [queryParams]="{category: 'laptop'}" mat-button>لپتاپ</a>
<a routerLink="/shop/products" [queryParams]="{category: 'phone'}" mat-button>گوشی</a>
<a routerLink="/shop/products" [queryParams]="{category: 'headphone'}" mat-button>هدفون</a>
    <a routerLink="/admin" mat-button (click)="isMobileMenuOpen = false">پنل مدیریت</a>
  </div>
</mat-toolbar>
