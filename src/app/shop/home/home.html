<div class="home-container">
  <!-- Hero Section -->
  <section class="hero-section">
    <div class="hero-content">
      <h1>بهترین لپتاپ، گوشی و هدفون</h1>
      <p>تجربه خریدی هوشمندانه با گارانتی اصل و قیمت رقابتی</p>
      <button mat-raised-button color="primary" class="hero-btn">
        مشاهده محصولات
      </button>
    </div>
  </section>

  <!-- Category Filter -->
  <div class="category-filter">
    <button mat-button color="primary" (click)="filterProducts('all')" [class.active]="selectedCategory === 'all'">
      <mat-icon>shopping_cart</mat-icon>
      <span>تمام محصولات</span>
    </button>
    <button mat-button color="primary" (click)="filterProducts('laptop')" [class.active]="selectedCategory === 'laptop'">
      <mat-icon>laptop</mat-icon>
      <span>لپتاپ</span>
    </button>
    <button mat-button color="primary" (click)="filterProducts('phone')" [class.active]="selectedCategory === 'phone'">
      <mat-icon>phone</mat-icon>
      <span>گوشی</span>
    </button>
    <button mat-button color="primary" (click)="filterProducts('headphone')" [class.active]="selectedCategory === 'headphone'">
      <mat-icon>headset</mat-icon>
      <span>هدفون</span>
    </button>
  </div>

  <!-- Product Grid -->
  <div class="product-grid">
    @for (product of filteredProducts; track product.id) {
      <div class="product-card">
        <img [src]="product.image" [alt]="product.name" />
        <h3>{{ product.name }}</h3>
        <p>{{ product.brand }}</p>
        <div class="price">{{ product.price | currency:'IRR':'symbol':'0.0' }}</div>
        <div class="rating">
          @for (i of starArray; track i) {
            <mat-icon *ngIf="i < product.rating" color="warn">star</mat-icon>
            <mat-icon *ngIf="i >= product.rating" color="disabled">star_border</mat-icon>
          }
        </div>
        
        <button mat-raised-button color="primary" (click)="addToCart(product)">افزودن به سبد</button>
      </div>
    }
  </div>
</div>
